name: Build ApexLift APK

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']   # README-only changes don't start a build
  workflow_dispatch:                          # adds a "Run workflow" button in the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Build the web app
        run: npm run build

      - name: Create the Android project
        run: npx cap add android

      - name: App icon + dark launch screen (from the assets folder)
        run: |
          npx --yes @capacitor/assets@3.0.5 generate --android
          node scripts/patch-android.mjs

      - name: Copy the web app into Android
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ApexLift-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
