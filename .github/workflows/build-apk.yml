name: Build ApexLift APK

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write   # lets the build publish the APK as a release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx cap add android
      - name: App icon + dark launch screen
        run: |
          npx --yes @capacitor/assets@3.0.5 generate --android
          node scripts/patch-android.mjs
      - run: npx cap sync android
      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Publish the APK (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ApexLift.apk
          gh release create "build-${{ github.run_number }}" ApexLift.apk \
            --title "ApexLift build ${{ github.run_number }}" \
            --notes "Built from commit ${{ github.sha }}" --latest
      - uses: actions/upload-artifact@v4
        with:
          name: ApexLift-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
